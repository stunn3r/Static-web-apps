
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>ML Infra Engineer — Study Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elev: #141414;
    --bg-card: #1a1a1a;
    --bg-card-hover: #202020;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;
    --text: #e8e8e8;
    --text-dim: #888;
    --text-faint: #555;
    --accent: #d4ff3a;
    --accent-dim: #8aa825;
    --done: #4ade80;
    --done-dim: #2a4a30;
    --warn: #ff9d3a;
    --danger: #ff5a5a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
    margin-bottom: 24px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .logo .accent { color: var(--accent); }

  .meta {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .subtitle {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: var(--text-dim);
    font-style: italic;
    margin-bottom: 24px;
  }

  /* Stats panel */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 4px;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    line-height: 1;
  }
  .stat-value.accent { color: var(--accent); }
  .stat-value.done { color: var(--done); }

  /* Progress bar */
  .progress-bar {
    height: 6px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width 0.5s ease;
    width: 0%;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    align-items: center;
  }

  .filter-group {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .filter-btn:hover {
    border-color: var(--border-strong);
    color: var(--text);
  }

  .filter-btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 700;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-left: auto;
  }

  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    user-select: none;
  }

  .toggle input { display: none; }

  .toggle-track {
    width: 32px;
    height: 18px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
    position: relative;
    transition: all 0.2s;
  }

  .toggle-track::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: all 0.2s;
  }

  .toggle input:checked ~ .toggle-track {
    background: var(--accent);
    border-color: var(--accent);
  }
  .toggle input:checked ~ .toggle-track::after {
    background: var(--bg);
    transform: translateX(14px);
  }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-faint);
    padding: 8px 12px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.15s;
  }

  .reset-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
  }

  /* Next-up callout */
  .next-up {
    background: linear-gradient(135deg, rgba(212, 255, 58, 0.08), rgba(212, 255, 58, 0.02));
    border: 1px solid var(--accent-dim);
    padding: 18px 20px;
    border-radius: 4px;
    margin-bottom: 32px;
    position: relative;
  }

  .next-up::before {
    content: '> NEXT';
    position: absolute;
    top: -10px;
    left: 16px;
    background: var(--bg);
    padding: 0 8px;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.2em;
    font-weight: 700;
  }

  .next-up-content {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .next-up-text { flex: 1; min-width: 200px; }

  .next-up-title {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    margin-bottom: 4px;
  }

  .next-up-meta {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .next-up.complete {
    background: linear-gradient(135deg, rgba(74, 222, 128, 0.08), rgba(74, 222, 128, 0.02));
    border-color: var(--done);
  }
  .next-up.complete::before { content: '✓ DONE'; color: var(--done); }

  /* Week section */
  .week {
    margin-bottom: 32px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .week-header {
    background: var(--bg-card);
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .week-header:hover { background: var(--bg-card-hover); }

  .week-header-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .week-num {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  .week-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
  }

  .week-progress {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .week-count {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .week-bar {
    width: 80px;
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    overflow: hidden;
  }

  .week-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s;
  }

  .week-toggle {
    color: var(--text-dim);
    font-size: 12px;
    transition: transform 0.2s;
  }

  .week.collapsed .week-toggle { transform: rotate(-90deg); }
  .week.collapsed .days { display: none; }

  /* Day */
  .day {
    border-bottom: 1px solid var(--border);
  }
  .day:last-child { border-bottom: none; }

  .day-header {
    padding: 10px 18px;
    background: var(--bg-elev);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .day-mins {
    color: var(--text-faint);
    font-size: 10px;
  }

  /* Topic */
  .topic {
    padding: 14px 18px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    cursor: pointer;
  }
  .topic:last-child { border-bottom: none; }
  .topic:hover { background: var(--bg-card); }

  .topic.done { opacity: 0.55; }
  .topic.done .topic-title { text-decoration: line-through; }

  .checkbox {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border: 1.5px solid var(--border-strong);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    margin-top: 1px;
    background: var(--bg);
  }

  .topic:hover .checkbox { border-color: var(--accent); }

  .topic.done .checkbox {
    background: var(--done);
    border-color: var(--done);
  }

  .checkbox::after {
    content: '✓';
    color: var(--bg);
    font-weight: 900;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .topic.done .checkbox::after { opacity: 1; }

  .topic-content { flex: 1; min-width: 0; }

  .topic-meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }

  .topic-id {
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.05em;
    font-weight: 700;
  }

  .topic-time {
    font-size: 10px;
    color: var(--text-faint);
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid var(--border);
  }

  .topic-tag {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 2px 6px;
    border-radius: 2px;
    font-weight: 600;
  }

  .tag-foundation { background: rgba(212, 255, 58, 0.1); color: var(--accent); }
  .tag-build { background: rgba(255, 157, 58, 0.1); color: var(--warn); }
  .tag-deep { background: rgba(74, 222, 128, 0.1); color: var(--done); }
  .tag-prod { background: rgba(255, 90, 90, 0.1); color: var(--danger); }

  .topic-title {
    font-size: 13px;
    color: var(--text);
    line-height: 1.4;
  }

  .topic-module {
    font-size: 10px;
    color: var(--text-faint);
    margin-top: 4px;
    letter-spacing: 0.05em;
  }

  /* Hide checked when filter active */
  .hide-done .topic.done { display: none; }

  /* Footer */
  footer {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--text-faint);
    font-size: 11px;
    letter-spacing: 0.05em;
  }

  /* Mobile */
  @media (max-width: 700px) {
    .container { padding: 16px 14px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat-value { font-size: 20px; }
    .logo { font-size: 22px; }
    .toggle-row { margin-left: 0; width: 100%; justify-content: space-between; }
    .filter-group { width: 100%; }
    .filter-btn { flex: 1; padding: 8px 8px; font-size: 11px; }
    .week-header-left { width: 100%; }
    .topic { padding: 12px 14px; }
    .day-header { padding: 8px 14px; }
  }

  /* Subtle entry */
  .week {
    animation: fadeUp 0.4s ease backwards;
  }
  .week:nth-child(1) { animation-delay: 0.05s; }
  .week:nth-child(2) { animation-delay: 0.1s; }
  .week:nth-child(3) { animation-delay: 0.15s; }
  .week:nth-child(4) { animation-delay: 0.2s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Print friendly */
  @media print {
    body::before { display: none; }
    .controls, .next-up, footer { display: none; }
    .week { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-top">
      <div class="logo">ml.infra<span class="accent">/</span>path</div>
      <div class="meta">v1 · 18 modules · ~22 weeks</div>
    </div>
    <div class="subtitle">From cloud architect to inference engineer — the realistic route.</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Topics done</div>
        <div class="stat-value done" id="stat-done">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Topics total</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Weeks complete</div>
        <div class="stat-value accent" id="stat-weeks">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Progress</div>
        <div class="stat-value accent" id="stat-pct">0%</div>
      </div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="controls">
      <div class="filter-group" id="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="foundation">Foundation</button>
        <button class="filter-btn" data-filter="deep">Deep</button>
        <button class="filter-btn" data-filter="build">Build</button>
        <button class="filter-btn" data-filter="prod">Production</button>
      </div>
      <div class="toggle-row">
        <label class="toggle">
          <input type="checkbox" id="hide-done">
          <span class="toggle-track"></span>
          <span>Hide done</span>
        </label>
        <button class="reset-btn" id="reset">Reset</button>
      </div>
    </div>
  </header>

  <div class="next-up" id="next-up">
    <div class="next-up-content">
      <div class="next-up-text">
        <div class="next-up-title" id="next-title">Loading…</div>
        <div class="next-up-meta" id="next-meta"></div>
      </div>
    </div>
  </div>

  <div id="weeks"></div>

  <footer>
    Progress saved locally · Built for focus · 2 hours / weekday
  </footer>
</div>

<script>
// ========== CURRICULUM DATA ==========
// Sequenced for 2hr/weekday = 10hr/week. ~22 weeks for modules 1-18.
// Each topic: id, title, mins, tag, module
// tags: foundation | deep | build | prod

const curriculum = [
  // ============ WEEK 1 ============
  { week: 1, title: "Math foundations — linear algebra and calculus", days: [

      { id: "1.1.1", title: "3Blue1Brown: Vectors, what even are they", mins: 45, tag: "foundation", module: "M1.1" },

    { day: "Thu", mins: 120, topics: [
      { id: "1.2.1", title: "3Blue1Brown: The essence of derivatives", mins: 35, tag: "foundation", module: "M1.2" },
      { id: "1.2.2", title: "3Blue1Brown: Chain rule and product rule", mins: 35, tag: "foundation", module: "M1.2" },
      { id: "1.2.3", title: "Notes: write 3 examples of chain rule applied", mins: 45, tag: "build", module: "M1.2" },
    ]},
    { day: "Fri", mins: 120, topics: [
      { id: "1.2.4", title: "Partial derivatives — Khan Academy or 3B1B", mins: 40, tag: "foundation", module: "M1.2" },

    { day: "Tue", mins: 120, topics: [

      { id: "1.3.5", title: "Sampling: why and how", mins: 35, tag: "foundation", module: "M1.3" },
      { id: "1.4.1", title: "Entropy: intuition and the formula", mins: 45, tag: "foundation", module: "M1.4" },
    ]},
    { day: "Wed", mins: 120, topics: [

    ]},

  // ============ WEEK 3 ============
  { week: 3, title: "PyTorch fluency", days: [

      { id: "2.2.1", title: "PyTorch tensors: creation, ops, dtypes", mins: 45, tag: "foundation", module: "M2.2" },

    { day: "Tue", mins: 120, topics: [

    { day: "Wed", mins: 120, topics: [

      { id: "2.2.9", title: "DataLoader and Dataset patterns", mins: 30, tag: "foundation", module: "M2.2" },

// ========== APP LOGIC ==========

const STORAGE_KEY = 'ml-infra-progress-v1';

// Load progress
let progress = {};
try {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) progress = JSON.parse(stored);
} catch (e) {
  progress = {};
}

let currentFilter = 'all';
let hideDone = false;

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) {
    console.warn('Could not save progress', e);
  }
}

function toggleTopic(id) {
  progress[id] = !progress[id];
  saveProgress();
  render();
}

function getAllTopics() {
  const all = [];
  curriculum.forEach(week => {
    week.days.forEach(day => {
      day.topics.forEach(topic => {
        all.push({ ...topic, week: week.week, weekTitle: week.title, day: day.day });
      });
    });
  });
  return all;
}

function getStats() {
  const all = getAllTopics();
  const filtered = currentFilter === 'all' ? all : all.filter(t => t.tag === currentFilter);
  const done = filtered.filter(t => progress[t.id]).length;
  const totalAll = all.length;
  const doneAll = all.filter(t => progress[t.id]).length;

  let weeksComplete = 0;
  curriculum.forEach(week => {
    const weekTopics = [];
    week.days.forEach(d => d.topics.forEach(t => weekTopics.push(t)));
    const weekDone = weekTopics.filter(t => progress[t.id]).length;
    if (weekTopics.length > 0 && weekDone === weekTopics.length) weeksComplete++;
  });

  return {
    done, total: filtered.length,
    doneAll, totalAll,
    weeksComplete,
    pct: totalAll > 0 ? Math.round(doneAll / totalAll * 100) : 0
  };
}

function findNext() {
  const all = getAllTopics();
  const filtered = currentFilter === 'all' ? all : all.filter(t => t.tag === currentFilter);
  const next = filtered.find(t => !progress[t.id]);
  return next;
}

function tagLabel(tag) {
  return ({ foundation: 'Foundation', deep: 'Deep', build: 'Build', prod: 'Production' })[tag] || tag;
}

function render() {
  // Stats
  const stats = getStats();
  document.getElementById('stat-done').textContent = stats.doneAll;
  document.getElementById('stat-total').textContent = stats.totalAll;
  document.getElementById('stat-weeks').textContent = `${stats.weeksComplete}/${curriculum.length}`;
  document.getElementById('stat-pct').textContent = `${stats.pct}%`;
  document.getElementById('progress-fill').style.width = `${stats.pct}%`;

  // Next up
  const next = findNext();
  const nextEl = document.getElementById('next-up');
  if (next) {
    nextEl.classList.remove('complete');
    document.getElementById('next-title').textContent = next.title;
    document.getElementById('next-meta').textContent =
      `${next.id} · Week ${next.week} ${next.day} · ${next.mins} min · ${tagLabel(next.tag)}`;
  } else {
    nextEl.classList.add('complete');
    document.getElementById('next-title').textContent = 'All filtered topics complete';
    document.getElementById('next-meta').textContent = stats.doneAll === stats.totalAll
      ? 'You finished everything. Go ship something.'
      : `Switch filter to see remaining topics. ${stats.doneAll}/${stats.totalAll} overall.`;
  }

  // Weeks
  const weeksContainer = document.getElementById('weeks');
  weeksContainer.innerHTML = '';

  curriculum.forEach(week => {
    const weekEl = document.createElement('div');
    weekEl.className = 'week';
    if (hideDone) weekEl.classList.add('hide-done');

    let weekTopics = [];
    week.days.forEach(d => d.topics.forEach(t => weekTopics.push(t)));
    const filteredTopics = currentFilter === 'all'
      ? weekTopics
      : weekTopics.filter(t => t.tag === currentFilter);
    const weekDone = filteredTopics.filter(t => progress[t.id]).length;
    const weekTotal = filteredTopics.length;
    if (weekTotal === 0) return;

    const weekPct = weekTotal > 0 ? Math.round(weekDone / weekTotal * 100) : 0;

    weekEl.innerHTML = `
      <div class="week-header" data-week="${week.week}">
        <div class="week-header-left">
          <div class="week-num">WEEK ${String(week.week).padStart(2, '0')}</div>
          <div class="week-title">${week.title}</div>
        </div>
        <div class="week-progress">
          <div class="week-count">${weekDone}/${weekTotal}</div>
          <div class="week-bar"><div class="week-bar-fill" style="width:${weekPct}%"></div></div>
          <div class="week-toggle">▼</div>
        </div>
      </div>
      <div class="days"></div>
    `;

    const daysEl = weekEl.querySelector('.days');

    week.days.forEach(day => {
      const dayTopics = currentFilter === 'all'
        ? day.topics
        : day.topics.filter(t => t.tag === currentFilter);
      if (dayTopics.length === 0) return;

      const dayMins = dayTopics.reduce((sum, t) => sum + t.mins, 0);

      const dayEl = document.createElement('div');
      dayEl.className = 'day';
      dayEl.innerHTML = `
        <div class="day-header">
          <span>${day.day}</span>
          <span class="day-mins">${dayMins} min</span>
        </div>
      `;

      dayTopics.forEach(topic => {
        const isDone = !!progress[topic.id];
        const topicEl = document.createElement('div');
        topicEl.className = `topic ${isDone ? 'done' : ''}`;
        topicEl.innerHTML = `
          <div class="checkbox"></div>
          <div class="topic-content">
            <div class="topic-meta-row">
              <span class="topic-id">${topic.id}</span>
              <span class="topic-time">${topic.mins} min</span>
              <span class="topic-tag tag-${topic.tag}">${tagLabel(topic.tag)}</span>
            </div>
            <div class="topic-title">${topic.title}</div>
            <div class="topic-module">${topic.module}</div>
          </div>
        `;
        topicEl.addEventListener('click', () => toggleTopic(topic.id));
        dayEl.appendChild(topicEl);
      });

      daysEl.appendChild(dayEl);
    });

    weeksContainer.appendChild(weekEl);

    // Week header collapse
    weekEl.querySelector('.week-header').addEventListener('click', (e) => {
      weekEl.classList.toggle('collapsed');
    });
  });
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

// Hide done toggle
document.getElementById('hide-done').addEventListener('change', (e) => {
  hideDone = e.target.checked;
  document.querySelectorAll('.week').forEach(w => {
    if (hideDone) w.classList.add('hide-done');
    else w.classList.remove('hide-done');
  });
});

// Reset
document.getElementById('reset').addEventListener('click', () => {
  if (confirm('Clear all progress? This cannot be undone.')) {
    progress = {};
    saveProgress();
    render();
  }
});

// Initial render
render();

// Auto-collapse completed weeks on first load
setTimeout(() => {
  document.querySelectorAll('.week').forEach(w => {
    const fill = w.querySelector('.week-bar-fill');
    if (fill && fill.style.width === '100%') w.classList.add('collapsed');
  });
}, 100);
</script>
</body>
</html>
